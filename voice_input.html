<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 4px;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      color: #f1f5f9;
    }
    .voice-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.7) 100%);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 10px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
    }
    .mic-button {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      color: #ffffff;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.35);
    }
    .mic-button:hover {
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      transform: scale(1.06);
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.55);
    }
    .mic-button.recording {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      border-color: #f87171;
      animation: mic-pulse 1.4s infinite;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.65);
    }
    @keyframes mic-pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .speech-transcript-box {
      flex: 1;
      font-size: 13.5px;
      color: #e2e8f0;
      min-height: 22px;
      line-height: 1.45;
      font-weight: 500;
    }
    .placeholder-text {
      color: #64748b;
      font-style: italic;
    }
    .action-btn {
      background: rgba(30, 41, 59, 0.9);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .action-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    .badge-status {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
      box-shadow: 0 0 8px #10b981;
    }
  </style>
</head>
<body>
  <div class="voice-wrapper">
    <button id="micBtn" class="mic-button" title="Click to ask your research inquiry verbally">
      <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
    <div id="transcript" class="speech-transcript-box">
      <span class="placeholder-text"><span class="badge-status"></span>Voice Assistant Ready — Click the microphone to dictate queries verbally (Chrome/Edge)...</span>
    </div>
    <button id="copyBtn" class="action-btn" style="display:none;" onclick="copyTranscript()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      Copy to Query
    </button>
  </div>

  <script>
    const micBtn = document.getElementById('micBtn');
    const transcriptEl = document.getElementById('transcript');
    const copyBtn = document.getElementById('copyBtn');
    let recognition = null;
    let isListening = false;
    let fullTranscript = '';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('recording');
        transcriptEl.innerHTML = '<span style="color:#38bdf8; font-weight:600;">🎙️ Listening to verbal research inquiry... speak clearly...</span>';
      };

      recognition.onresult = (event) => {
        let interim = '';
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            final += event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        fullTranscript = (final || interim).trim();
        if (fullTranscript) {
          transcriptEl.innerHTML = `<span style="color:#f8fafc; font-family:'JetBrains Mono', monospace; font-size:13px;">"${fullTranscript}"</span>`;
          copyBtn.style.display = 'inline-flex';
        }
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        stopListening();
        transcriptEl.innerHTML = `<span style="color:#f87171;">Microphone Notice: ${event.error}. You can also type directly in the search console.</span>`;
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      transcriptEl.innerHTML = '<span style="color:#94a3b8;">Microphone speech-to-text supported in Chrome/Edge. You can also upload audio notes or type in console.</span>';
    }

    function stopListening() {
      isListening = false;
      micBtn.classList.remove('recording');
    }

    micBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('Web Speech API is supported in Google Chrome and Microsoft Edge.');
        return;
      }
      if (isListening) {
        recognition.stop();
        stopListening();
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.warn(e);
        }
      }
    });

    function copyTranscript() {
      if (!fullTranscript) return;
      navigator.clipboard.writeText(fullTranscript).then(() => {
        const origHTML = copyBtn.innerHTML;
        copyBtn.innerHTML = '<span>✓ Copied to Clipboard!</span>';
        copyBtn.style.color = '#34d399';
        copyBtn.style.borderColor = '#34d399';
        setTimeout(() => {
          copyBtn.innerHTML = origHTML;
          copyBtn.style.color = '#38bdf8';
          copyBtn.style.borderColor = 'rgba(56, 189, 248, 0.3)';
        }, 1800);
      });
    }
  </script>
</body>
</html>
